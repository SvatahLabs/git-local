name: foundation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.26.x', '1.27.x']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - run: git --version
      - run: go test -race -parallel 4 -timeout 20m ./...
      - run: go vet ./...
      - run: go build -o bin/ ./cmd/git-local
        env:
          CGO_ENABLED: '0'
      - name: Build and smoke-test native release binary without Go on PATH
        run: go run ./scripts/release-binaries.go -version 0.1.4 -host-only -out dist/ci-host
      - uses: actions/upload-artifact@v4
        with:
          name: gitlocal-${{ matrix.os }}-go${{ matrix.go }}
          path: dist/ci-host/*
      - name: Build and smoke-test macOS installer
        if: runner.os == 'macOS'
        run: scripts/build-macos-installer.sh 0.1.4
  git-versions:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - gitVersion: '2.50.1'
            sha256: '7e3e6c36decbd8f1eedd14d42db6674be03671c2204864befa2a41756c5c8fc4'
          - gitVersion: '2.56.0'
            sha256: '26c56c296b38c0695b26fa95f475f1d01704d2d38e73465ca30b0b2f5dc789d3'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - name: Build selected Git version
        shell: bash
        run: |
          version='${{ matrix.gitVersion }}'
          curl --fail --location "https://www.kernel.org/pub/software/scm/git/git-$version.tar.xz" --output "$RUNNER_TEMP/git.tar.xz"
          printf '%s  %s\n' '${{ matrix.sha256 }}' "$RUNNER_TEMP/git.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/git.tar.xz" -C "$RUNNER_TEMP"
          make -C "$RUNNER_TEMP/git-$version" -j2 prefix="$RUNNER_TEMP/git-selected" NO_RUST=YesPlease NO_GETTEXT=YesPlease NO_TCLTK=YesPlease NO_CURL=YesPlease NO_PERL=YesPlease install
          echo "$RUNNER_TEMP/git-selected/bin" >> "$GITHUB_PATH"
      - run: git --version
      - run: go test -parallel 4 -timeout 20m ./...
      - name: Smoke-test release binary against selected Git
        run: go run ./scripts/release-binaries.go -version 0.1.4 -host-only -out dist/ci-git-${{ matrix.gitVersion }}
  macos-current-git:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - name: Build Git 2.56.0
        shell: bash
        run: |
          curl --fail --location https://www.kernel.org/pub/software/scm/git/git-2.56.0.tar.xz --output "$RUNNER_TEMP/git.tar.xz"
          printf '%s  %s\n' 26c56c296b38c0695b26fa95f475f1d01704d2d38e73465ca30b0b2f5dc789d3 "$RUNNER_TEMP/git.tar.xz" | shasum -a 256 -c -
          tar -xJf "$RUNNER_TEMP/git.tar.xz" -C "$RUNNER_TEMP"
          make -C "$RUNNER_TEMP/git-2.56.0" -j2 prefix="$RUNNER_TEMP/git-current" NO_RUST=YesPlease NO_GETTEXT=YesPlease NO_TCLTK=YesPlease NO_CURL=YesPlease NO_PERL=YesPlease install
          echo "$RUNNER_TEMP/git-current/bin" >> "$GITHUB_PATH"
      - run: git --version
      - run: go test -race -parallel 4 -timeout 20m ./...
      - name: Smoke-test release binary against current Git
        run: go run ./scripts/release-binaries.go -version 0.1.4 -host-only -out dist/ci-macos-current
